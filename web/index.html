<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketsPlease · local ticket desk</title>
<meta name="description" content="A single-operator IT ticket tracker. Local, no login, no cloud.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230e6b54'/><circle cx='8' cy='8' r='2' fill='%23ffffff'/><path d='M8 2.5v2M8 11.5v2M2.5 8h2M11.5 8h2' stroke='%23ffffff' stroke-width='1.4' stroke-linecap='round'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=8">

<!-- Resolve the theme before first paint so there's no light-mode flash.
     Stores only an explicit "light"/"dark" choice; absent = follow the OS. -->
<script>
(function () {
  try {
    var p = localStorage.getItem("ticketsplease.theme");
    var pref = (p === "light" || p === "dark") ? p : "system";
    var dark = pref === "dark" || (pref === "system" &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {}
})();
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to tickets</a>

<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="#/" aria-label="TicketsPlease home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="2.6" fill="var(--accent)"/>
          <circle cx="12" cy="12" r="6.5" stroke="var(--accent)" stroke-width="1.4" opacity="0.55"/>
          <circle cx="12" cy="12" r="10.2" stroke="var(--accent)" stroke-width="1.2" opacity="0.28"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">TICKETS, PLEASE</span>
        <span class="brand-tag">local ticket desk</span>
      </span>
    </a>
    <form id="searchForm" class="search" role="search">
      <input id="searchInput" type="search" autocomplete="off"
             placeholder="Search tickets — title or notes…" aria-label="Search tickets">
    </form>
    <div class="mast-actions">
      <div class="theme-seg" role="radiogroup" aria-label="Color theme">
        <button type="button" class="theme-opt" data-theme-choice="light"
                role="radio" aria-checked="false" title="Light theme" aria-label="Light theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </svg>
        </button>
        <button type="button" class="theme-opt" data-theme-choice="dark"
                role="radio" aria-checked="false" title="Dark theme" aria-label="Dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/>
          </svg>
        </button>
        <button type="button" class="theme-opt" data-theme-choice="system"
                role="radio" aria-checked="false" title="Match system" aria-label="Match system theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="1.5"/>
            <path d="M9 20h6M12 16v4"/>
          </svg>
        </button>
      </div>
      <a class="btn" href="api/export" title="Download a snapshot of all data">Backup</a>
      <button id="restoreBtn" class="btn" type="button"
              title="Replace all data from a backup file">Restore</button>
      <input id="restoreFile" type="file" accept=".json,application/json" hidden
             aria-label="Backup file to restore">
    </div>
  </div>
</header>

<main id="main"><div id="view" class="view" tabindex="-1"></div></main>

<script src="app.js?v=8"></script>
</body>
</html>
